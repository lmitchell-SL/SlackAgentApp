# Slack app manifest for "SL Agents".
# Before pasting into Slack, replace YOUR-SITE with your Netlify site name
# (for example https://sl-agents.netlify.app/slack/events).
display_information:
  name: SL Agents
  description: Talk to the team's Claude agents from Slack.
  background_color: "#2c2d30"
features:
  bot_user:
    display_name: SL Agents
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - channels:history
      - groups:history
      - users:read
      - reactions:write
settings:
  event_subscriptions:
    request_url: https://YOUR-SITE.netlify.app/slack/events
    bot_events:
      - app_mention
      - message.channels
      - message.groups
  interactivity:
    is_enabled: true
    request_url: https://YOUR-SITE.netlify.app/slack/interactive
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
